openapi: 3.0.3
info:
  title: Liminis API
  version: 1.0.0
  description: |
    The backend's public API: moments, people, eras and regions, read-only, and one endpoint that counts anonymous
    visitor events.

    Through the site, only the paths the browser calls are forwarded (`/api/search`, `/api/eras/{id}`,
    `/api/years/{year}/people` and `POST /api/events`); the frontend's server fetches the rest while rendering.

    Years are integers, negative for BCE. There is no year 0: 1 BCE is followed by 1 CE.

    The site is read in English and French: every read takes `lang`. A record comes back in French when the release has
    its French, else in English, and says which in its `lang`. Lines the API words itself (a life's regime changes, the
    doors to the nearest moments) and the names of regions without a written name follow `lang`.
  license:
    name: MIT
    url: https://github.com/charlotte-hib/liminis-history/blob/main/LICENSE
servers:
  - url: /
    description: The backend (port 8080 on a local run), or the site, which forwards the paths the browser calls.
# Public and read-only apart from the visitor events: no authentication.
security: []
tags:
  - name: moments
    description: A place over a few years, small enough to tell as one story.
  - name: people
    description: People in the world around them.
  - name: eras
    description: A region at a time span, named after who governed it.
  - name: regions
    description: Places, seen through today's borders.
  - name: search
    description: Accent-insensitive search over people and moments.
  - name: events
    description: Anonymous visitor events, counted and never stored.

paths:
  /api/moments:
    get:
      tags: [moments]
      operationId: listMoments
      summary: Published moments
      description: Every published moment, with who governed, the length of its story and its cast.
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The published moments, by focus year.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MomentSummary"

  /api/moments/{id}:
    get:
      tags: [moments]
      operationId: getMoment
      summary: A moment
      description: The world around a moment, its eras, people, everyday lives, events and doors.
      parameters:
        - $ref: "#/components/parameters/Language"
        - $ref: "#/components/parameters/MomentId"
      responses:
        "200":
          description: The moment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/moments/{id}/people:
    get:
      tags: [moments]
      operationId: listMomentPeople
      summary: A moment's people in a year
      description: |
        A selection of the people alive in a year of a moment, from its region or tied to it by a place of their lives.
        Draw 0 ranks them: those with documented relations first (the story's cast, curated connections, shared
        events), then those tied to the moment's place, then the most written about. Each further draw picks others at
        random, weighted the same way, never repeating one before every person has been drawn once; after the last,
        draws start over. The same draw always picks the same people.
      parameters:
        - $ref: "#/components/parameters/Language"
        - $ref: "#/components/parameters/MomentId"
        - name: year
          in: query
          required: true
          schema:
            type: integer
            format: int32
        - name: draw
          in: query
          required: false
          description: Which draw, from 0. Draws past the last start over.
          schema:
            type: integer
            format: int32
            default: 0
            minimum: 0
      responses:
        "200":
          description: The people of that draw.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentPeople"
        "400":
          $ref: "#/components/responses/BadRequest"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/moments/{id}/story:
    get:
      tags: [moments]
      operationId: getStory
      summary: A moment's story
      description: The story cards of a moment, in order, and its doors to other moments.
      parameters:
        - $ref: "#/components/parameters/Language"
        - $ref: "#/components/parameters/MomentId"
      responses:
        "200":
          description: The story.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Story"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{slug}:
    get:
      tags: [people]
      operationId: getPerson
      summary: A person in a year
      description: |
        A person in the world around them in a year, with their life in their time. Without a year, or with a year
        outside their life, the page looks at their prime.
      parameters:
        - $ref: "#/components/parameters/Language"
        - name: slug
          in: path
          required: true
          description: The person's slug, e.g. `emile-zola`.
          schema:
            type: string
        - name: year
          in: query
          required: false
          description: The year to look at them in.
          schema:
            type: integer
            format: int32
      responses:
        "200":
          description: The person.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PersonDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/years/{year}/people:
    get:
      tags: [people]
      operationId: listAliveElsewhere
      summary: People alive elsewhere in a year
      description: >-
        A few people alive in a year in each region with eras but one: among the most written about of each, those in
        the middle of their lives.
      parameters:
        - $ref: "#/components/parameters/Language"
        - name: year
          in: path
          required: true
          schema:
            type: integer
            format: int32
        - name: exclude
          in: query
          required: true
          description: The code of the region to leave out, e.g. `FR`.
          schema:
            type: string
            pattern: "^[A-Z]{2}$"
        - name: perRegion
          in: query
          required: false
          description: How many people per region.
          schema:
            type: integer
            format: int32
            default: 2
            minimum: 1
            maximum: 5
      responses:
        "200":
          description: The people, by region.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/search:
    get:
      tags: [search]
      operationId: search
      summary: Search people and moments
      description: Accent-insensitive, so `zola` finds Émile Zola. Fewer than two characters find nothing.
      parameters:
        - $ref: "#/components/parameters/Language"
        - name: q
          in: query
          required: true
          description: What to look for. Under two characters, once trimmed, it finds nothing.
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: Names that start with the query first, then the most famous in their time and place.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResults"
        "400":
          $ref: "#/components/responses/BadRequest"

  /api/regions:
    get:
      tags: [regions]
      operationId: listRegions
      summary: Regions
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: The regions whose eras are written, by name. People come from other regions too.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Region"

  /api/eras:
    get:
      tags: [eras]
      operationId: listEras
      summary: Eras
      parameters:
        - $ref: "#/components/parameters/Language"
      responses:
        "200":
          description: Every era, by start year.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Era"

  /api/eras/{id}:
    get:
      tags: [eras]
      operationId: getEra
      summary: An era
      description: An era with the people alive in it by domain, its events and the moments set in it.
      parameters:
        - $ref: "#/components/parameters/Language"
        - name: id
          in: path
          required: true
          description: The era's id, e.g. `fr-third-republic`.
          schema:
            type: string
      responses:
        "200":
          description: The era.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EraDetail"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/events:
    post:
      tags: [events]
      operationId: recordEvent
      summary: Count a visitor event
      description: |
        Counts one anonymous event from the browser. Nothing identifies the visitor: no address, user agent, cookie
        or id is read or kept. Every value must come from a fixed vocabulary. `navigator.sendBeacon` sends
        `text/plain`, so that is accepted too.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VisitorEvent"
          text/plain:
            schema:
              type: string
              description: The same JSON, as sent by `navigator.sendBeacon`.
      responses:
        "204":
          description: Counted.
        "400":
          description: Not JSON, or a name or value outside the vocabularies.
        "413":
          description: Larger than 1 KB.

components:
  parameters:
    Language:
      name: lang
      in: query
      required: false
      description: The language to read the records in, where the release has them in it.
      schema:
        $ref: "#/components/schemas/Language"
    MomentId:
      name: id
      in: path
      required: true
      description: The moment's id, e.g. `paris-1870s`.
      schema:
        type: string

  responses:
    NotFound:
      description: No such record, or not published.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"
    BadRequest:
      description: A parameter is missing, of the wrong type, or outside its constraints.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/ProblemDetail"

  schemas:
    ProblemDetail:
      description: An error, as RFC 9457 Problem Details.
      type: object
      properties:
        type:
          description: A URI that identifies the kind of problem; `about:blank` when the status says it all.
          type: string
          default: about:blank
        title:
          description: The status's reason phrase, e.g. "Not Found".
          type: string
        status:
          type: integer
          format: int32
        detail:
          description: 'What went wrong with this request, e.g. "Unknown moment: atlantis".'
          type: string
        instance:
          description: The path that was requested.
          type: string

    Language:
      description: A language the site is read in.
      type: string
      enum: [en, fr]
      default: en

    Domain:
      description: What a person is known for.
      type: string
      enum: [POWER, ARTS, EVERYDAY]

    Region:
      description: A place, seen through today's borders.
      type: object
      required: [code, name]
      properties:
        code:
          type: string
          example: FR
        name:
          type: string
          example: France

    Artwork:
      description: A public-domain image with its credit and the page it comes from.
      type: object
      required: [url, credit, sourceUrl]
      properties:
        url:
          type: string
        credit:
          type: string
        sourceUrl:
          type: string

    WorldAround:
      description: The world around a moment, one line per domain, and what is happening elsewhere at the same time.
      type: object
      required: [governs, everyday, arts, meanwhile, lang]
      properties:
        governs:
          type: string
        everyday:
          type: string
        arts:
          type: string
        meanwhile:
          type: string
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    Era:
      description: A region at a time span, named after who governed it. Both years are inclusive.
      type: object
      required: [id, label, regionCode, region, governedBy, startYear, endYear, lang]
      properties:
        id:
          type: string
        label:
          type: string
        regionCode:
          type: string
        region:
          type: string
        governedBy:
          type: string
        startYear:
          type: integer
          format: int32
        endYear:
          type: integer
          format: int32
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    Person:
      type: object
      required: [slug, name, birthYear, deathYear, datesApproximate, regionCode, region, domain, occupations, bioShort, portraitUrl, lang, bioLang]
      properties:
        slug:
          type: string
        name:
          type: string
        birthYear:
          type: integer
          format: int32
        deathYear:
          type: integer
          format: int32
          nullable: true
        datesApproximate:
          description: True when the birth or death year is only known approximately.
          type: boolean
        regionCode:
          type: string
        region:
          type: string
        domain:
          $ref: "#/components/schemas/Domain"
        occupations:
          description: Up to three, the main one first. Empty when none is known.
          type: array
          items:
            type: string
        bioShort:
          description: One or two sentences, hand-written or the lead of the Wikipedia article.
          type: string
          nullable: true
        portraitUrl:
          type: string
          nullable: true
        lang:
          description: The language of their name and occupations.
          allOf:
            - $ref: "#/components/schemas/Language"
        bioLang:
          description: The language of their bio, which can differ from their name's.
          allOf:
            - $ref: "#/components/schemas/Language"


    Life:
      description: >-
        A typical existence in an era, shown as representative of the period rather than as a real person. Drawn with its
        art, else its icon, else a generic one.
      type: object
      required: [id, label, description, startYear, endYear, art, icon, lang]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        startYear:
          type: integer
          format: int32
        endYear:
          type: integer
          format: int32
        art:
          type: object
          allOf:
            - $ref: "#/components/schemas/LifeArt"
          nullable: true
        icon:
          type: string
          allOf:
            - $ref: "#/components/schemas/LifeIcon"
          nullable: true
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    LifeArt:
      description: A public-domain image of a typical life, with its credit, the page it comes from, and how to frame it in a circle.
      type: object
      required: [url, credit, sourceUrl, position, fit]
      properties:
        url:
          type: string
        credit:
          type: string
        sourceUrl:
          type: string
        position:
          description: The point kept in view when cropping, as CSS `object-position`.
          type: string
          example: 50% 70%
        fit:
          $ref: "#/components/schemas/ArtFit"

    ArtFit:
      description: How an image fills its frame, as CSS `object-fit`, `COVER` cropped to fill it, `CONTAIN` whole with a margin.
      type: string
      enum: [COVER, CONTAIN]

    LifeIcon:
      description: An icon for a typical life without an image, after the work it stands for.
      type: string
      enum: [AMPHORA, BRIEFCASE, CAR, COINS, CONCIERGE_BELL, FACTORY, FISH, HAMMER, LEAF, PICKAXE, SHELL, SHIELD, SHIRT, SHOVEL, SPOOL, SPROUT, WHEAT]

    Participant:
      description: Someone in an event, with their part in it, e.g. "author", in the event's language.
      type: object
      required: [person, role]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        role:
          type: string

    Event:
      description: A dated, sourced event.
      type: object
      required: [id, title, year, description, sourceUrl, participants, lang]
      properties:
        id:
          type: string
        title:
          type: string
        year:
          type: integer
          format: int32
        description:
          type: string
        sourceUrl:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    EraDetail:
      type: object
      required: [era, people, events, moments]
      properties:
        era:
          $ref: "#/components/schemas/Era"
        people:
          description: >-
            The people alive in the era, by domain (`POWER`, `ARTS`, `EVERYDAY`): the most written about, up to 12 each.
            Empty domains are left out.
          type: object
          additionalProperties:
            type: array
            items:
              $ref: "#/components/schemas/Person"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        moments:
          description: The moments set under this regime, to step into.
          type: array
          items:
            $ref: "#/components/schemas/MomentSummary"

    MomentSummary:
      description: What a moment shows on a card, enough to choose it, not to explore it.
      type: object
      required: [id, regionCode, region, place, period, startYear, endYear, focusYear, hook, art, governedBy, storyCards, cast, featured, lang]
      properties:
        id:
          type: string
        regionCode:
          type: string
        region:
          type: string
        place:
          type: string
          example: Paris
        period:
          type: string
          example: 1870s
        startYear:
          type: integer
          format: int32
        endYear:
          type: integer
          format: int32
        focusYear:
          description: The year the moment opens on.
          type: integer
          format: int32
        hook:
          type: string
        art:
          type: object
          allOf:
            - $ref: "#/components/schemas/Artwork"
          nullable: true
        governedBy:
          description: Who governed the place in the focus year.
          type: string
          nullable: true
        storyCards:
          description: Number of cards in the story; 0 when no story is written yet.
          type: integer
          format: int32
        cast:
          description: The people the story features.
          type: array
          items:
            $ref: "#/components/schemas/Person"
        featured:
          description: Shown first on the start page.
          type: boolean
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    Door:
      description: A way out of a story into another moment, e.g. "Meanwhile, elsewhere".
      type: object
      required: [kind, text, target, faces, lang]
      properties:
        kind:
          type: string
        text:
          type: string
        target:
          $ref: "#/components/schemas/MomentSummary"
        faces:
          description: People to show on the door, when it follows someone.
          type: array
          items:
            $ref: "#/components/schemas/Person"
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    MomentDetail:
      description: >-
        Everything the moment page needs to open on its focus year. Its people for other years come from
        `/api/moments/{id}/people`.
      type: object
      required: [moment, world, eras, people, lives, events, doors]
      properties:
        moment:
          $ref: "#/components/schemas/MomentSummary"
        world:
          type: object
          allOf:
            - $ref: "#/components/schemas/WorldAround"
          nullable: true
        eras:
          type: array
          items:
            $ref: "#/components/schemas/Era"
        people:
          description: The focus year's first draw of `/api/moments/{id}/people`.
          allOf:
            - $ref: "#/components/schemas/MomentPeople"
        lives:
          type: array
          items:
            $ref: "#/components/schemas/Life"
        events:
          type: array
          items:
            $ref: "#/components/schemas/Event"
        doors:
          type: array
          items:
            $ref: "#/components/schemas/Door"

    MomentPeople:
      type: object
      required: [year, draw, draws, people]
      properties:
        year:
          type: integer
          format: int32
        draw:
          description: The draw asked for, counted from 0 within `draws`.
          type: integer
          format: int32
        draws:
          description: How many different draws there are, 1 when everyone fits in one.
          type: integer
          format: int32
        people:
          description: At most 24, in rank order for draw 0.
          type: array
          items:
            $ref: "#/components/schemas/Person"

    CardType:
      type: string
      enum: [SCENE, PERSON, LIFE, EVENT]

    StoryCard:
      description: One screen of a moment's story. Person, life and event cards carry the record they are about.
      type: object
      required: [type, kicker, title, text, year, person, life, event, art, lang]
      properties:
        type:
          $ref: "#/components/schemas/CardType"
        kicker:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        text:
          type: string
          nullable: true
        year:
          description: The year the card is set in, used for ages.
          type: integer
          format: int32
          nullable: true
        person:
          type: object
          allOf:
            - $ref: "#/components/schemas/Person"
          nullable: true
        life:
          type: object
          allOf:
            - $ref: "#/components/schemas/Life"
          nullable: true
        event:
          type: object
          allOf:
            - $ref: "#/components/schemas/Event"
          nullable: true
        art:
          description: Replaces the moment's artwork while this card is shown.
          type: object
          allOf:
            - $ref: "#/components/schemas/Artwork"
          nullable: true
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    Story:
      type: object
      required: [moment, cards, doors]
      properties:
        moment:
          $ref: "#/components/schemas/MomentSummary"
        cards:
          type: array
          items:
            $ref: "#/components/schemas/StoryCard"
        doors:
          type: array
          items:
            $ref: "#/components/schemas/Door"

    LifeLineKind:
      description: ANECDOTE is a short story told about them, approved by the curator.
      type: string
      enum: [BIRTH, ERA, EVENT, OWN_EVENT, ANECDOTE, DEATH]

    AnecdoteSource:
      description: Where an anecdote was read or heard. A book has a title and a page; a podcast, a video or a documentary a title, and an episode, a minute or a URL; a web page a URL.
      type: object
      required: [title, page, episode, minute, url]
      properties:
        title:
          type: string
          nullable: true
        page:
          type: string
          nullable: true
        episode:
          type: string
          nullable: true
        minute:
          type: string
          nullable: true
        url:
          type: string
          nullable: true

    LifeLine:
      description: One line of "their life in their time", a dated change around them or a story told about them, with their age.
      type: object
      required: [year, age, kind, text, role, era, source, lang]
      properties:
        year:
          type: integer
          format: int32
        age:
          type: integer
          format: int32
          nullable: true
        kind:
          $ref: "#/components/schemas/LifeLineKind"
        text:
          type: string
        role:
          type: string
          nullable: true
        era:
          description: The regime a BIRTH line was born under or an ERA line begins, to open; none on other lines.
          type: object
          allOf:
            - $ref: "#/components/schemas/Era"
          nullable: true
        source:
          description: Where an ANECDOTE line comes from; none on other lines.
          type: object
          allOf:
            - $ref: "#/components/schemas/AnecdoteSource"
          nullable: true
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    Connection:
      description: Someone a person was linked to, how (a pair like "tea master and lord", or their role in a shared event), when, and the source.
      type: object
      required: [person, kind, year, text, sourceUrl, lang]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        kind:
          type: string
        year:
          type: integer
          format: int32
        text:
          type: string
        sourceUrl:
          type: string
        lang:
          description: The language of the record's text.
          allOf:
            - $ref: "#/components/schemas/Language"


    PersonDetail:
      type: object
      required: [person, about, wikipediaUrl, year, age, world, worldMoment, lifeline, connections, aroundPeople, aroundLives, elsewhere, moments, aboutLang]
      properties:
        person:
          $ref: "#/components/schemas/Person"
        about:
          description: The first paragraph of the Wikipedia article.
          type: string
          nullable: true
        wikipediaUrl:
          type: string
          nullable: true
        year:
          description: The year the rest of the page looks at, the one asked for if they were alive then, else their prime.
          type: integer
          format: int32
        age:
          type: integer
          format: int32
        world:
          type: object
          allOf:
            - $ref: "#/components/schemas/WorldAround"
          nullable: true
        worldMoment:
          type: object
          allOf:
            - $ref: "#/components/schemas/MomentSummary"
          nullable: true
        lifeline:
          type: array
          items:
            $ref: "#/components/schemas/LifeLine"
        connections:
          description: Sourced links to other people, curated ones first, then shared documented events.
          type: array
          items:
            $ref: "#/components/schemas/Connection"
        aroundPeople:
          description: People alive in their region that year, or tied to it by a place, the most written about first, up to 12.
          type: array
          items:
            $ref: "#/components/schemas/Person"
        aroundLives:
          type: array
          items:
            $ref: "#/components/schemas/Life"
        elsewhere:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        moments:
          type: array
          items:
            $ref: "#/components/schemas/MomentSummary"
        aboutLang:
          description: The language of `about` and the article `wikipediaUrl` leads to.
          allOf:
            - $ref: "#/components/schemas/Language"


    SearchResults:
      type: object
      required: [people, moments]
      properties:
        people:
          type: array
          items:
            $ref: "#/components/schemas/Person"
        moments:
          type: array
          items:
            $ref: "#/components/schemas/MomentSummary"

    VisitorEvent:
      description: |
        One anonymous event. Which fields count depends on `name`; the others are ignored.
      type: object
      required: [name]
      properties:
        name:
          type: string
          enum:
            - page_view
            - story_started
            - story_card_reached
            - story_completed
            - person_panel_opened
            - person_full_page_opened
            - search_used
            - search_result_opened
        page:
          description: page_view, the page by template, never a URL.
          type: string
          enum: [home, moment, story, person]
        moment:
          description: A published moment's id, for page views of a moment or its story, and for story events.
          type: string
        card:
          description: story_card_reached, the 1-based card.
          type: integer
          format: int32
          minimum: 1
        source:
          description: person_panel_opened and person_full_page_opened, where the visitor came from.
          type: string
          enum: [home, moment, story, person, search, panel, direct, external]
        kind:
          description: search_result_opened, what was picked.
          type: string
          enum: [person, moment]
