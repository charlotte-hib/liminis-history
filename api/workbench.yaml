openapi: 3.0.3
info:
  title: Liminis workbench API
  version: 1.0.0
  description: |
    The curator's workbench, on the Mac only: claims (anything a careful reader could dispute) with their sources and
    the curator's decisions, and the runs that fetch, map and propose.

    It listens on 127.0.0.1 only and answers only requests addressed to `localhost` or `127.0.0.1`. Every request
    needs an access token from `auth` (on `localhost:9000`) with the scope its operation names: curate gets one for the
    curator, signed in with a passkey; `wb` gets its own.

    People are Wikidata ids (Q-ids). Years are integers, negative for BCE. There is no year 0: 1 BCE is followed by
    1 CE.
  license:
    name: MIT
    url: https://github.com/charlotte-hib/liminis-history/blob/main/LICENSE
servers:
  - url: http://localhost:8090
    description: The workbench, on the curator's computer.
tags:
  - name: claims
    description: What the curator approves, edits or rejects, with its sources and the decisions taken.
  - name: people
    description: The fetched people, and what Wikidata and Wikipedia say about them, to review their claims against.
  - name: occupations
    description: The fetched occupations and who holds them, to map them to the site's domains.
  - name: moments
    description: The release's moments, everyone alive in each, and their stories, drafted with Claude.
  - name: runs
    description: Imports, mappings, proposals and drafts, one at a time, in the background.
  - name: publication
    description: The approved claims, written into the private data repository through a pull request.

paths:
  /api/queues:
    get:
      tags: [claims]
      operationId: listQueues
      security:
        - auth: ["curation:read"]
      summary: Waiting claims, per type
      description: How many claims of each type wait for the curator, and how many of them carry each flag.
      responses:
        "200":
          description: One queue per claim type that has claims, by type.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Queue"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/claims:
    get:
      tags: [claims]
      operationId: listClaims
      security:
        - auth: ["curation:read"]
      summary: Claims
      description: Claims in the order they were proposed, a page at a time.
      parameters:
        - name: type
          in: query
          schema:
            $ref: "#/components/schemas/ClaimType"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/ClaimStatus"
        - name: flag
          in: query
          schema:
            $ref: "#/components/schemas/Flag"
        - name: moment
          in: query
          description: Only the claims about the moment's people (their facts) and its story.
          schema:
            $ref: "#/components/schemas/MomentId"
        - name: after
          in: query
          description: The `seq` of the last claim of the previous page.
          schema:
            type: integer
            format: int64
            minimum: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: The claims after `after`, at most `limit` of them.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Claim"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
    post:
      tags: [claims]
      operationId: addClaim
      security:
        - auth: ["curation:write"]
      summary: Add a claim by hand
      description: |
        A connection, an event or an anecdote the curator found, from a podcast, a book or anywhere else, with at least
        one source. Its id comes from what it is about: proposing the same thing again answers 409.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewClaim"
      responses:
        "201":
          description: The claim, waiting for review.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/claims/{id}:
    get:
      tags: [claims]
      operationId: getClaim
      security:
        - auth: ["curation:read"]
      summary: A claim
      description: A claim with its sources and every decision taken on it. Its `ETag` is the version to send back in
        `If-Match` when deciding on it or undoing a decision.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
      responses:
        "200":
          description: The claim.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/claims/{id}/decisions:
    post:
      tags: [claims]
      operationId: decide
      security:
        - auth: ["curation:write"]
      summary: Decide on a claim
      description: |
        Approve (with an edited payload, if given), reject, or keep for later. A rejection and keeping for later need a
        note saying why. The decision is logged with the payload before and after. Needs the claim's version in
        `If-Match`, so a decision is never taken on a claim that changed since it was read.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IfMatch"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewDecision"
      responses:
        "200":
          description: The claim after the decision.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/claims/{id}/undo:
    post:
      tags: [claims]
      operationId: undo
      security:
        - auth: ["curation:write"]
      summary: Undo the last decision
      description: |
        Puts back the status and payload from before the curator's last decision on this claim, and logs it. Needs the
        claim's version in `If-Match`, as deciding does.
      parameters:
        - $ref: "#/components/parameters/ClaimId"
        - $ref: "#/components/parameters/IfMatch"
      responses:
        "200":
          description: The claim as it was before that decision.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "428":
          $ref: "#/components/responses/PreconditionRequired"

  /api/people:
    get:
      tags: [people]
      operationId: findPeople
      security:
        - auth: ["curation:read"]
      summary: Find people by name
      description: |
        The fetched people whose English or French label contains `q`, ignoring case, those it starts with first, then
        the best known. A Q-id finds that person.
      parameters:
        - name: q
          in: query
          required: true
          schema:
            type: string
            minLength: 2
            maxLength: 100
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 50
            default: 10
      responses:
        "200":
          description: At most `limit` people.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PersonSummary"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/people/{qid}/evidence:
    get:
      tags: [people]
      operationId: getEvidence
      security:
        - auth: ["curation:read"]
      summary: What the sources say about a person
      description: |
        Every statement of the person's dates, occupations and places as the last import fetched it from Wikidata,
        deprecated ones left out, with how many references name a source; and the intros of their English and French
        Wikipedia articles.
      parameters:
        - name: qid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Qid"
      responses:
        "200":
          description: The evidence.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Evidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/people/{qid}/facts:
    post:
      tags: [claims]
      operationId: proposeFacts
      security:
        - auth: ["curation:write"]
      summary: Propose a person's facts
      description: |
        Proposes the person's facts as the dataset holds them, as `wb claims` does for the best known people of each
        moment: a new claim waits for review; an existing one is refreshed by the same rules.
      parameters:
        - name: qid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Qid"
      responses:
        "200":
          description: The person's facts claim.
          headers:
            ETag:
              $ref: "#/components/headers/ETag"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ClaimDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/moments:
    get:
      tags: [moments]
      operationId: listMoments
      security:
        - auth: ["curation:read"]
      summary: The release's moments
      description: Each moment of the release the workbench loaded, with how many people lived there and what waits.
      responses:
        "200":
          description: The moments, by id.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/MomentSummary"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"

  /api/moments/{id}:
    get:
      tags: [moments]
      operationId: getMoment
      security:
        - auth: ["curation:read"]
      summary: A moment
      description: The moment, with the story the release has for it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MomentId"
      responses:
        "200":
          description: The moment.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentDetail"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/moments/{id}/story:
    post:
      tags: [moments]
      operationId: draftStory
      security:
        - auth: ["curation:write"]
      summary: Draft the moment's story
      description: |
        Starts the run that drafts the moment's story with Claude and proposes it as the moment's `STORY` claim, as
        `wb draft` does. The moment's `draft` follows it.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MomentId"
      responses:
        "202":
          description: The run, started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/moments/{id}/people:
    get:
      tags: [moments]
      operationId: listMomentPeople
      security:
        - auth: ["curation:read"]
      summary: Everyone alive in a moment
      description: |
        The fetched people tied to the moment's region by a place of theirs (where they were born, died, worked or
        lived, by the country it lies in today), alive at some time during the moment: the best known first, a page
        at a time, each with their facts claim if they have one.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MomentId"
        - name: offset
          in: query
          schema:
            type: integer
            minimum: 0
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 50
      responses:
        "200":
          description: A page of the people.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MomentPeople"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/moments/{id}/preview:
    get:
      tags: [moments]
      operationId: getStoryPreview
      security:
        - auth: ["curation:read"]
      summary: What a story's cards show
      description: |
        What the site would show on the moment's story cards: the moment's painting, the paintings the release's
        cards carry, and the people, lives and events named. A person written by hand comes from the release; a
        fetched one, named by Q-id, from the dataset and their Wikipedia articles. An id found nowhere is left out.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/MomentId"
        - name: person
          in: query
          schema:
            type: array
            maxItems: 24
            items:
              type: string
              maxLength: 100
        - name: life
          in: query
          schema:
            type: array
            maxItems: 24
            items:
              type: string
              maxLength: 100
        - name: event
          in: query
          schema:
            type: array
            maxItems: 24
            items:
              type: string
              maxLength: 100
      responses:
        "200":
          description: What the cards show.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoryPreview"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/occupations/{qid}:
    get:
      tags: [occupations]
      operationId: getOccupation
      security:
        - auth: ["curation:read"]
      summary: Who holds an occupation
      description: |
        An occupation, or a class of them, as the last mapping holds it: its labels, its classes, how many people hold
        it among their first three occupations (directly or through a narrower one) and as their first, and the best
        known of them.
      parameters:
        - name: qid
          in: path
          required: true
          schema:
            $ref: "#/components/schemas/Qid"
      responses:
        "200":
          description: The occupation.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/OccupationEvidence"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/runs:
    get:
      tags: [runs]
      operationId: listRuns
      security:
        - auth: ["runs"]
      summary: Runs since the workbench started
      responses:
        "200":
          description: The runs, newest first.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Run"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
    post:
      tags: [runs]
      operationId: startRun
      security:
        - auth: ["runs"]
      summary: Start a run
      description: Starts the run in the background. Only one runs at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewRun"
      responses:
        "202":
          description: The run, started.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"

  /api/runs/{id}:
    get:
      tags: [runs]
      operationId: getRun
      security:
        - auth: ["runs"]
      summary: A run
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
            format: int64
      responses:
        "200":
          description: The run.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Run"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"

  /api/publication:
    get:
      tags: [publication]
      operationId: previewPublication
      security:
        - auth: ["curation:read"]
      summary: What a publish would change
      description: |
        The approved claims as the files of `data/` that publishing writes whole (`data/occupations.jsonl`,
        `data/corrections.jsonl`), compared with those files on the data repository's `main`: each record added,
        changed or removed; and the approved stories written into their moments' files (`data/moments/<id>.json`),
        each a story changed. Also the publish pull request open, if any, the corrections for people written by hand
        in `people.jsonl`, which the release gives no effect, and the approved stories held back.
      responses:
        "200":
          description: The changes.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      tags: [publication]
      operationId: publish
      security:
        - auth: ["publish"]
      summary: Publish
      description: |
        Commits the changes on the branch `publish` of the data repository, built on `main` at `base`, and opens its
        pull request, or updates the one open. With nothing to change, closes the one open. Needs a passkey used within
        the publication's `maxAge` seconds: an older one is a 401 with `error="insufficient_user_authentication"` and
        `max_age` in `WWW-Authenticate` (RFC 9470), for curate to ask for the passkey again.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewPublication"
      responses:
        "200":
          description: The changes published, with their pull request; none when there was nothing to publish.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Publication"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "412":
          description: The data repository's `main` moved since `base`. Look at the changes again, then publish.
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/Problem"
        "503":
          $ref: "#/components/responses/Unavailable"

components:
  securitySchemes:
    auth:
      type: oauth2
      description: |
        Access tokens from `auth`, the curator's authorization server: JWTs signed with ES256, for the audience
        `workbench`, valid 10 minutes. The workbench checks them against the keys `auth` publishes.
      flows:
        authorizationCode:
          authorizationUrl: http://localhost:9000/oauth2/authorize
          tokenUrl: http://localhost:9000/oauth2/token
          refreshUrl: http://localhost:9000/oauth2/token
          scopes:
            curation:read: Read queues, claims, people and their evidence.
            curation:write: Add claims, decide on them and undo a decision.
            publish: Publish the approved claims to the data repository, after a recent passkey.
        clientCredentials:
          tokenUrl: http://localhost:9000/oauth2/token
          scopes:
            curation:read: Read queues, claims, people and their evidence.
            runs: Start runs and follow them.

  headers:
    ETag:
      description: The claim's version, a number in quotes, e.g. `"3"`. It changes with every decision, undo or refresh.
      schema:
        type: string
        example: '"3"'

  parameters:
    IfMatch:
      name: If-Match
      in: header
      description: |
        The claim's `ETag`, as last read. Required: without it the answer is 428; when the claim changed since, 412.
        Optional in this contract only so that a missing one gets its own answer.
      required: false
      schema:
        type: string
        example: '"3"'
    ClaimId:
      name: id
      in: path
      required: true
      description: The claim's id, URL-encoded, e.g. `person-facts:Q535`.
      schema:
        type: string
        maxLength: 200

  responses:
    BadRequest:
      description: The request does not match the contract, or the claim does not hold together.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: |
        No access token, or one that is expired, not signed by `auth`, or not for the workbench; or, to publish, one
        whose passkey is too old.
    Forbidden:
      description: The access token lacks the operation's scope.
    NotFound:
      description: Nothing has this id.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Conflict:
      description: The claim already exists, there is nothing to undo, or a run is already running.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: The claim changed since the version in `If-Match`. Read it again, then decide.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: No GitHub App is set up to publish with, or GitHub refused or did not answer.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionRequired:
      description: No `If-Match`. Send the claim's `ETag`.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"

  schemas:
    ClaimType:
      type: string
      description: |
        `PERSON_FACTS`: a person's facts as fetched, one claim per person. `CONNECTION`: two people linked at a date.
        `EVENT`: something that happened in a region in a year. `ANECDOTE`: a short story about one person.
        `OCCUPATION_DOMAIN`: the domain of the people who hold an occupation, one claim per occupation or class.
        `STORY`: a moment's story, drafted with Claude, one claim per moment.
      enum: [PERSON_FACTS, CONNECTION, EVENT, ANECDOTE, OCCUPATION_DOMAIN, STORY]

    ClaimStatus:
      type: string
      description: |
        `CANDIDATE` waits for review; `NEEDS_WORK` was kept for later, with a note.
      enum: [CANDIDATE, APPROVED, REJECTED, NEEDS_WORK]

    Origin:
      type: string
      enum: [WIKIDATA, BOOK, CLAUDE, MANUAL]

    Flag:
      type: string
      description: Why a claim needs a person's eye, whatever the error rate of its kind.
      enum: [POORLY_DOCUMENTED, CONFLICT, ODD, SENSITIVE, SINGLE_SOURCE]

    FlagReason:
      type: object
      required: [flag, reason]
      properties:
        flag:
          $ref: "#/components/schemas/Flag"
        reason:
          type: string
          example: BIRTH_UNREFERENCED

    Queue:
      type: object
      required: [type, candidates, needsWork, flags]
      properties:
        type:
          $ref: "#/components/schemas/ClaimType"
        candidates:
          type: integer
          description: Claims waiting for review.
        needsWork:
          type: integer
          description: Claims kept for later.
        flags:
          type: object
          description: How many of the waiting claims carry each flag.
          additionalProperties:
            type: integer

    Claim:
      type: object
      required: [id, seq, type, status, origin, flags, payload]
      properties:
        id:
          type: string
          example: person-facts:Q535
        seq:
          type: integer
          format: int64
          description: The order claims were proposed in.
        type:
          $ref: "#/components/schemas/ClaimType"
        status:
          $ref: "#/components/schemas/ClaimStatus"
        origin:
          $ref: "#/components/schemas/Origin"
        flags:
          type: array
          items:
            $ref: "#/components/schemas/FlagReason"
        payload:
          $ref: "#/components/schemas/Payload"

    ClaimDetail:
      allOf:
        - $ref: "#/components/schemas/Claim"
        - type: object
          required: [proposal, sources, decisions]
          properties:
            proposal:
              description: The payload as last proposed, before any edit by the curator.
              allOf:
                - $ref: "#/components/schemas/Payload"
            sources:
              type: array
              items:
                $ref: "#/components/schemas/Source"
            decisions:
              type: array
              description: Oldest first.
              items:
                $ref: "#/components/schemas/Decision"

    NewClaim:
      type: object
      required: [payload, sources]
      properties:
        payload:
          $ref: "#/components/schemas/Payload"
        sources:
          type: array
          minItems: 1
          maxItems: 10
          items:
            $ref: "#/components/schemas/Source"
        note:
          type: string
          maxLength: 2000

    Payload:
      description: The record as it would ship, by claim type.
      oneOf:
        - $ref: "#/components/schemas/PersonFacts"
        - $ref: "#/components/schemas/Connection"
        - $ref: "#/components/schemas/Event"
        - $ref: "#/components/schemas/Anecdote"
        - $ref: "#/components/schemas/OccupationDomain"
        - $ref: "#/components/schemas/Story"
      discriminator:
        propertyName: type
        mapping:
          PERSON_FACTS: "#/components/schemas/PersonFacts"
          CONNECTION: "#/components/schemas/Connection"
          EVENT: "#/components/schemas/Event"
          ANECDOTE: "#/components/schemas/Anecdote"
          OCCUPATION_DOMAIN: "#/components/schemas/OccupationDomain"
          STORY: "#/components/schemas/Story"

    PersonFacts:
      type: object
      description: |
        A person's facts as Wikidata states them. Whether each statement has a reference shows in the claim's flags,
        not here: a reference added later does not change the facts.
      required: [type, person, label, born, bornPrecision, died, diedEstimated, datesApproximate, occupations, places]
      properties:
        type:
          type: string
        person:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
        labelFr:
          type: string
        born:
          $ref: "#/components/schemas/Year"
        bornPrecision:
          type: integer
          description: Wikidata's precision. 9 a year, 8 a decade, 7 a century, 10 and 11 a month and a day.
        died:
          $ref: "#/components/schemas/Year"
        diedPrecision:
          type: integer
          description: None when the year of death is estimated.
        diedEstimated:
          type: boolean
        datesApproximate:
          type: boolean
        enwiki:
          type: string
          description: The English Wikipedia article's title.
        frwiki:
          type: string
        occupations:
          type: array
          description: In Wikidata's order, best rank first. The site shows the first.
          items:
            $ref: "#/components/schemas/Occupation"
        places:
          type: array
          items:
            $ref: "#/components/schemas/Place"

    Occupation:
      type: object
      required: [occupation, label]
      properties:
        occupation:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
        labelFr:
          type: string

    Place:
      type: object
      required: [role, place, label]
      properties:
        role:
          type: string
          enum: [BIRTH, DEATH, WORK, RESIDENCE]
        place:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
        country:
          type: string
          description: The ISO code of the country it lies in today.
          example: FR
        startYear:
          $ref: "#/components/schemas/Year"
        endYear:
          $ref: "#/components/schemas/Year"

    Connection:
      type: object
      description: Two people linked at a date, in one plain sentence.
      required: [type, people, kind, year, text]
      properties:
        type:
          type: string
        people:
          type: array
          minItems: 2
          maxItems: 2
          items:
            $ref: "#/components/schemas/Qid"
        kind:
          type: string
          minLength: 1
          maxLength: 60
          example: sculptor and subject
        year:
          $ref: "#/components/schemas/Year"
        text:
          type: string
          minLength: 1
          maxLength: 250

    Event:
      type: object
      description: Something that happened in a region in a year.
      required: [type, region, year, title, description, participants]
      properties:
        type:
          type: string
        region:
          type: string
          pattern: "^[A-Z]{2}$"
          example: FR
        year:
          $ref: "#/components/schemas/Year"
        title:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          minLength: 1
          maxLength: 400
        participants:
          type: array
          items:
            $ref: "#/components/schemas/Participant"

    Participant:
      type: object
      required: [person, role]
      properties:
        person:
          $ref: "#/components/schemas/Qid"
        role:
          type: string
          minLength: 1
          maxLength: 60

    Anecdote:
      type: object
      description: A short story about one person, at a date.
      required: [type, person, year, text]
      properties:
        type:
          type: string
        person:
          $ref: "#/components/schemas/Qid"
        year:
          $ref: "#/components/schemas/Year"
        text:
          type: string
          minLength: 1
          maxLength: 400

    OccupationDomain:
      type: object
      description: |
        The domain of the people who hold an occupation, or of a class of occupations (it then covers the narrower
        ones not mapped themselves). Proposed without one: the curator chooses it. `NONE` says the occupation tells
        nothing of a life's work ("aristocrat"), so a person's next occupation decides.
      required: [type, occupation, label]
      properties:
        type:
          type: string
        occupation:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
        labelFr:
          type: string
        domain:
          $ref: "#/components/schemas/OccupationChoice"

    OccupationChoice:
      type: string
      enum: [POWER, ARTS, EVERYDAY, NONE]

    Story:
      type: object
      description: |
        A moment's story as it would ship into its file in `data/moments/`, each line with the quotes it rests on.
        Publishing writes the hook, the world and the cards, and leaves the rest of the moment's file as it is.
      required: [type, moment, hook, world, cards]
      properties:
        type:
          type: string
        moment:
          $ref: "#/components/schemas/MomentId"
        hook:
          $ref: "#/components/schemas/StoryLine"
        world:
          $ref: "#/components/schemas/StoryWorld"
        cards:
          type: array
          minItems: 1
          maxItems: 12
          items:
            $ref: "#/components/schemas/StoryCard"

    StoryLine:
      type: object
      required: [text, citations]
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 400
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"

    StoryWorld:
      type: object
      description: The world around the moment, one line each.
      required: [governs, everyday, arts, meanwhile]
      properties:
        governs:
          $ref: "#/components/schemas/StoryLine"
        everyday:
          $ref: "#/components/schemas/StoryLine"
        arts:
          $ref: "#/components/schemas/StoryLine"
        meanwhile:
          $ref: "#/components/schemas/StoryLine"

    StoryCard:
      type: object
      description: |
        One card. A `PERSON` card names a person (the id of one written by hand, else a Q-id), a `LIFE` card a typical
        life, an `EVENT` card an event; a `SCENE` card has a title.
      required: [type, citations]
      properties:
        type:
          $ref: "#/components/schemas/CardType"
        kicker:
          type: string
          maxLength: 120
        title:
          type: string
          maxLength: 120
        text:
          type: string
          maxLength: 600
        year:
          $ref: "#/components/schemas/Year"
        person:
          type: string
          maxLength: 100
        life:
          type: string
          maxLength: 100
        event:
          type: string
          maxLength: 100
        label:
          type: string
          description: The name of the person, life or event the card shows, for reading. Not published.
          maxLength: 300
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"

    CardType:
      type: string
      enum: [SCENE, PERSON, LIFE, EVENT]

    Citation:
      type: object
      description: A passage copied from one of the texts the story was drafted from. Not published.
      required: [source, title, quote]
      properties:
        source:
          type: string
          description: The text's id, by what it is about.
          example: person:Q535
        title:
          type: string
        quote:
          type: string
          maxLength: 2000

    MomentId:
      type: string
      pattern: "^[a-z0-9-]+$"
      maxLength: 100
      example: paris-1870s

    MomentSummary:
      type: object
      required: [id, region, place, period, start, end, focus, people, waiting, cards]
      properties:
        id:
          $ref: "#/components/schemas/MomentId"
        region:
          type: string
          example: FR
        place:
          type: string
        period:
          type: string
          example: 1870s
        start:
          $ref: "#/components/schemas/Year"
        end:
          $ref: "#/components/schemas/Year"
        focus:
          $ref: "#/components/schemas/Year"
        people:
          type: integer
          description: The fetched people alive there, as the moment's people list counts them.
        waiting:
          type: integer
          description: The claims about the moment's people and its story waiting for review.
        cards:
          type: integer
          description: The cards of the story the release has.
        story:
          $ref: "#/components/schemas/ClaimStatus"

    MomentDetail:
      allOf:
        - $ref: "#/components/schemas/MomentSummary"
        - type: object
          required: [hook, storyCards]
          properties:
            hook:
              type: string
              description: The release's hook.
            world:
              $ref: "#/components/schemas/World"
            storyCards:
              type: array
              description: The release's cards, in order.
              items:
                $ref: "#/components/schemas/StoryCard"
            draft:
              description: The last run that drafted the moment's story since the workbench started, if any.
              allOf:
                - $ref: "#/components/schemas/Run"

    StoryPreview:
      type: object
      required: [cardArt, people, lives, events]
      properties:
        art:
          description: The moment's painting, behind every card without one of its own.
          allOf:
            - $ref: "#/components/schemas/Artwork"
        cardArt:
          type: array
          description: |
            The paintings the release's cards carry, by what each card shows: publishing keeps a painting for a card
            showing the same.
          items:
            $ref: "#/components/schemas/CardArtwork"
        people:
          type: array
          items:
            $ref: "#/components/schemas/PreviewPerson"
        lives:
          type: array
          items:
            $ref: "#/components/schemas/PreviewLife"
        events:
          type: array
          items:
            $ref: "#/components/schemas/PreviewEvent"

    Artwork:
      type: object
      description: A public-domain image, its credit and the page it comes from.
      required: [url, credit, sourceUrl]
      properties:
        url:
          type: string
        credit:
          type: string
        sourceUrl:
          type: string

    CardArtwork:
      type: object
      required: [type, art]
      properties:
        type:
          $ref: "#/components/schemas/CardType"
        person:
          type: string
        life:
          type: string
        event:
          type: string
        art:
          $ref: "#/components/schemas/Artwork"

    PreviewPerson:
      type: object
      required: [id, name, born]
      properties:
        id:
          type: string
          description: The id a card names them by.
        name:
          type: string
        born:
          $ref: "#/components/schemas/Year"
        died:
          $ref: "#/components/schemas/Year"
        occupation:
          type: string
          description: The first occupation, the one the site shows.
        portrait:
          type: string
        bio:
          type: string
          description: What the card says when it has no text of its own.

    PreviewLife:
      type: object
      required: [id, label, description]
      properties:
        id:
          type: string
        label:
          type: string
        description:
          type: string
        art:
          $ref: "#/components/schemas/LifeArtwork"
        icon:
          type: string
          description: Drawn when there is no picture, after the work the life stands for.
          example: WHEAT

    LifeArtwork:
      allOf:
        - $ref: "#/components/schemas/Artwork"
        - type: object
          required: [position, fit]
          properties:
            position:
              type: string
              description: The point kept in view when cropped to a circle, as CSS `object-position`.
              example: 50% 30%
            fit:
              type: string
              enum: [COVER, CONTAIN]

    PreviewEvent:
      type: object
      required: [id, title, year, description, sourceUrl, participants]
      properties:
        id:
          type: string
        title:
          type: string
        year:
          $ref: "#/components/schemas/Year"
        description:
          type: string
        sourceUrl:
          type: string
        participants:
          type: array
          items:
            $ref: "#/components/schemas/EventRole"

    EventRole:
      type: object
      required: [name, role]
      properties:
        name:
          type: string
        role:
          type: string

    World:
      type: object
      required: [governs, everyday, arts, meanwhile]
      properties:
        governs:
          type: string
        everyday:
          type: string
        arts:
          type: string
        meanwhile:
          type: string

    MomentPeople:
      type: object
      required: [total, people]
      properties:
        total:
          type: integer
        people:
          type: array
          items:
            $ref: "#/components/schemas/MomentPerson"

    MomentPerson:
      allOf:
        - $ref: "#/components/schemas/PersonSummary"
        - type: object
          required: [sitelinks]
          properties:
            sitelinks:
              type: integer
            claim:
              $ref: "#/components/schemas/ClaimStatus"

    OccupationEvidence:
      type: object
      required: [occupation, label, people, first, examples, parents]
      properties:
        occupation:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
        labelFr:
          type: string
        people:
          type: integer
          description: How many people hold it among their first three occupations, directly or through a narrower one.
        first:
          type: integer
          description: How many people hold it as their first occupation, the one the site shows first.
        examples:
          type: array
          description: The best known of them, at most 8.
          items:
            $ref: "#/components/schemas/PersonSummary"
        parents:
          type: array
          description: The classes it belongs to, best rank first.
          items:
            $ref: "#/components/schemas/OccupationLabel"

    OccupationLabel:
      type: object
      required: [occupation, label]
      properties:
        occupation:
          $ref: "#/components/schemas/Qid"
        label:
          type: string

    Source:
      type: object
      description: |
        What a claim rests on. `WIKIDATA`: an entity (`entity`, `revision`). `WIKIPEDIA`: an article (`language`,
        `title`, `revision`). `BOOK`: `title` and `page`. `WEB`: `url`. `MEDIA`: a podcast, a video or a documentary
        (`title`, `episode`, `minute`, `url`).
      required: [kind]
      properties:
        kind:
          type: string
          enum: [WIKIDATA, WIKIPEDIA, BOOK, WEB, MEDIA]
        entity:
          $ref: "#/components/schemas/Qid"
        revision:
          type: integer
          format: int64
        language:
          type: string
          pattern: "^[a-z]{2,3}$"
        title:
          type: string
          maxLength: 300
        page:
          type: string
          maxLength: 20
        episode:
          type: string
          maxLength: 300
        minute:
          type: string
          pattern: "^\\d{1,3}:\\d{2}(:\\d{2})?$"
          example: "12:40"
        url:
          type: string
          pattern: "^https?://.+$"
          maxLength: 2000
        quote:
          type: string
          maxLength: 2000
          description: The passage the claim rests on.

    NewDecision:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [APPROVE, REJECT, NEEDS_WORK]
        payload:
          description: The edited record, to approve instead of the current one.
          allOf:
            - $ref: "#/components/schemas/Payload"
        note:
          type: string
          maxLength: 2000

    Decision:
      type: object
      required: [by, to, decidedAt]
      properties:
        by:
          type: string
          description: Who decided. `curator`, or `rule` when the workbench proposed or refreshed the claim.
          example: curator
        from:
          $ref: "#/components/schemas/ClaimStatus"
        to:
          $ref: "#/components/schemas/ClaimStatus"
        edited:
          type: boolean
          description: Whether the payload changed.
        note:
          type: string
        decidedAt:
          type: string
          format: date-time

    NewRun:
      type: object
      required: [kind]
      properties:
        kind:
          $ref: "#/components/schemas/RunKind"
        moment:
          type: string
          description: The moment to draft, for `STORY_DRAFT`.
          pattern: "^[a-z0-9-]+$"
          maxLength: 100

    RunKind:
      type: string
      description: |
        `WIKIDATA_IMPORT` fetches Wikidata's people, or resumes the import that stopped. `DATASET_MAPPING` maps the last
        finished import to the dataset's rows. `DATASET_EXPORT` writes those rows to the fetched dataset's files, in
        `backend/dataset-export/`. `PERSON_FACTS_CLAIMS` proposes the facts of the people of the release's moments.
        `OCCUPATION_CLAIMS` proposes a domain claim for every occupation the dataset's people hold, and their classes:
        those most held as a first occupation first, then the classes nobody holds directly. `STORY_DRAFT` drafts a moment's story with Claude and proposes it as the
        moment's `STORY` claim; its result says what the draft cost.
      enum: [WIKIDATA_IMPORT, DATASET_MAPPING, DATASET_EXPORT, PERSON_FACTS_CLAIMS, OCCUPATION_CLAIMS, STORY_DRAFT]

    Run:
      type: object
      required: [id, kind, status, startedAt]
      properties:
        id:
          type: integer
          format: int64
        kind:
          $ref: "#/components/schemas/RunKind"
        moment:
          type: string
        status:
          type: string
          enum: [RUNNING, SUCCEEDED, FAILED]
        startedAt:
          type: string
          format: date-time
        endedAt:
          type: string
          format: date-time
        result:
          type: string
          description: What it came to, or why it failed.

    PersonSummary:
      type: object
      required: [person, label, born, died]
      properties:
        person:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
        labelFr:
          type: string
        born:
          $ref: "#/components/schemas/Year"
        died:
          $ref: "#/components/schemas/Year"
        occupation:
          type: string
          description: The first occupation's label, the one the site shows.

    Evidence:
      type: object
      required: [person, revision, statements, articles]
      properties:
        person:
          $ref: "#/components/schemas/Qid"
        revision:
          type: integer
          format: int64
          description: The Wikidata revision the import fetched.
        statements:
          type: array
          description: By field in the order of the enum, then best rank first, in Wikidata's order.
          items:
            $ref: "#/components/schemas/Statement"
        articles:
          type: array
          items:
            $ref: "#/components/schemas/Article"

    Statement:
      type: object
      description: One Wikidata statement. A date has `year` and `precision`; an occupation or a place has `item`.
      required: [field, property, rank, references]
      properties:
        field:
          type: string
          enum: [BORN, DIED, OCCUPATION, BIRTHPLACE, DEATHPLACE, WORKPLACE, RESIDENCE]
        property:
          type: string
          example: P569
        year:
          $ref: "#/components/schemas/Year"
        precision:
          type: integer
          description: Wikidata's precision. 9 a year, 8 a decade, 7 a century, 10 and 11 a month and a day.
        circa:
          type: boolean
          description: Qualified "circa".
        item:
          $ref: "#/components/schemas/Qid"
        label:
          type: string
          description: The item's English label, else French, else its Q-id.
        unknown:
          type: boolean
          description: Wikidata says "unknown value".
        rank:
          type: string
          enum: [PREFERRED, NORMAL]
        references:
          type: integer
          description: References naming a source; one that only names the Wikimedia project it was copied from does not count.

    Article:
      type: object
      required: [language, title, url, extract]
      properties:
        language:
          type: string
          example: en
        title:
          type: string
        url:
          type: string
        extract:
          type: string
          description: The intro, as plain text, as Wikipedia gives it.
        thumbnailUrl:
          type: string

    Publication:
      type: object
      required: [base, files, withoutEffect, heldBack, maxAge]
      properties:
        base:
          type: string
          description: The commit of the data repository's `main` the changes are counted from. Send it to publish.
          pattern: "^[0-9a-f]{40}$"
        files:
          type: array
          description: The files publishing writes, with their changes, in the same order every time.
          items:
            $ref: "#/components/schemas/FileChanges"
        pullRequest:
          $ref: "#/components/schemas/PullRequest"
        withoutEffect:
          type: array
          description: People written by hand in `people.jsonl` with a correction, which their record overrides.
          items:
            $ref: "#/components/schemas/Qid"
        heldBack:
          type: array
          description: Approved stories not published, and why.
          items:
            $ref: "#/components/schemas/HeldBack"
        maxAge:
          type: integer
          format: int32
          description: How recently, in seconds, the curator must have used their passkey to publish.
          example: 300

    FileChanges:
      type: object
      required: [path, changes]
      properties:
        path:
          type: string
          example: data/occupations.jsonl
        changes:
          type: array
          description: By the records' ids.
          items:
            $ref: "#/components/schemas/RecordChange"

    RecordChange:
      type: object
      required: [id, change]
      properties:
        id:
          type: string
          description: The record's id, a Q-id, or the moment's id in a moment's file.
        change:
          type: string
          enum: [ADDED, CHANGED, REMOVED]
        before:
          type: string
          description: The record's line as `main` has it, JSON; a moment's story only, in its file. None when added.
        after:
          type: string
          description: The record's line as publishing writes it, JSON. None when removed.

    HeldBack:
      type: object
      required: [moment, reason]
      properties:
        moment:
          $ref: "#/components/schemas/MomentId"
        reason:
          type: string

    PullRequest:
      type: object
      required: [number, url]
      properties:
        number:
          type: integer
          format: int32
        url:
          type: string
          example: https://github.com/charlotte-hib/liminis-history-data/pull/4

    NewPublication:
      type: object
      required: [base]
      properties:
        base:
          type: string
          description: The `base` of the changes the curator looked at.
          pattern: "^[0-9a-f]{40}$"

    Qid:
      type: string
      pattern: "^Q[1-9][0-9]*$"
      example: Q535

    Year:
      type: integer
      description: Negative for BCE. There is no year 0.
      format: int32
      minimum: -3500
      maximum: 2100

    Problem:
      type: object
      description: RFC 9457 Problem Details.
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
        instance:
          type: string
