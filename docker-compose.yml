# frontend (Next.js) -> backend (Spring Boot, never published) -> db (Postgres, never published). The frontend
# listens on localhost only: on the VPS, the server's Caddy terminates HTTPS in front of it (deploy/Caddyfile).
# Locally: docker compose up --build, then http://localhost:3000. In production, deploy/deploy.sh
# sets the images to the digests the pipeline built and signed (in .env), so the VPS never builds.
#
# Monitoring (profile "monitoring", off unless asked for): Prometheus scrapes the backend's metrics on the
# Compose network, and Grafana shows them on localhost:3001 only, never through Caddy. Grafana's admin
# password comes from grafana.env (GF_SECURITY_ADMIN_PASSWORD=..., untracked). deploy/deploy.sh turns the
# profile on when the server has that file. Locally:
#   docker compose --profile monitoring up --build, then http://localhost:3001 (user admin).

# Named here rather than after the checkout's directory, so its volumes keep their names wherever it is cloned.
name: liminis

services:
  backend:
    image: ${BACKEND_IMAGE:-liminis-backend}
    build:
      context: ./backend
      # The API contract the build generates code from (backend/Dockerfile).
      additional_contexts:
        api: ./api
    # The release it serves, read-only: in production the private release in release.lock, unpacked on the server
    # (RELEASE_DIR, written to .env by deploy/deploy.sh); locally and in CI, sample/. Its schema is named after the
    # deployed commit (RELEASE_SHA); without one, it is rebuilt on every start.
    volumes:
      - ${RELEASE_DIR:-./sample}:/app/release:ro
    environment:
      APP_RELEASE_ID: ${RELEASE_SHA:-}
    # Only the passwords of its two roles (db/roles.env, then db-roles.env), which application-prod.yaml reads: never
    # the superuser's.
    env_file:
      - db/roles.env
      - path: db-roles.env
        required: false
    depends_on:
      db-roles:
        condition: service_completed_successfully
    restart: unless-stopped
    mem_limit: 768m

  # Postgres, on the Compose network only. Its password comes from db.env (POSTGRES_PASSWORD=..., untracked), which
  # deploy/deploy.sh creates on the server; locally and in CI there is none, and db/defaults.env applies. The backend
  # reloads the release on every start, so the volume needs no backup.
  db:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    env_file:
      - db/defaults.env
      - path: db.env
        required: false
    environment:
      # Postgres's own collation (code point order) rather than the C library's, which can change order, and
      # invalidate indexes, when the image's Debian is upgraded.
      POSTGRES_INITDB_ARGS: --locale-provider=builtin --locale=C.UTF-8
    # Sized for a small server: the database holds a few megabytes.
    command:
      - -c
      - shared_buffers=64MB
      - -c
      - max_connections=20
      - -c
      - work_mem=4MB
      - -c
      - effective_cache_size=192MB
    volumes:
      # Since Postgres 18 the image keeps its data in a versioned directory under /var/lib/postgresql.
      - db-data:/var/lib/postgresql
    healthcheck:
      # Over TCP: while the image initialises a new database, Postgres listens on its socket only.
      test: [CMD-SHELL, pg_isready --host=localhost --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"]
      interval: 10s
      start_period: 60s
      start_interval: 1s
    restart: unless-stopped
    mem_limit: 256m

  # Creates the backend's roles, or sets their passwords, then exits (db/roles.sql): on every docker compose up, so it
  # works on a database created before them.
  db-roles:
    image: postgres:18.6-trixie@sha256:74935e72241653ca55e0414067e6d8763aceb8a810eb51b452253ec3dcfc4336
    env_file:
      - db/defaults.env
      - path: db.env
        required: false
      - db/roles.env
      - path: db-roles.env
        required: false
    environment:
      PGHOST: db
    volumes:
      - ./db/roles.sql:/roles.sql:ro
    command:
      - sh
      - -c
      - >-
        PGPASSWORD="$$POSTGRES_PASSWORD" psql --quiet --username="$$POSTGRES_USER" --dbname="$$POSTGRES_DB"
        --set=owner_password="$$SITE_OWNER_PASSWORD" --set=reader_password="$$SITE_READER_PASSWORD" --file=/roles.sql
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${FRONTEND_IMAGE:-liminis-frontend}
    build:
      context: ./frontend
      args:
        BACKEND_URL: http://backend:8080
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - backend
    restart: unless-stopped
    mem_limit: 384m

  # 30 days or 1 GB of samples, whichever comes first (monitoring/prometheus/prometheus.yml).
  prometheus:
    image: prom/prometheus:v3.15.0@sha256:efd719c99d83b060d9daefdcf00360461adf279f45ef5391f8d111892118753e
    profiles: [monitoring]
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --config.auto-reload
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./monitoring/prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    depends_on:
      - backend
    restart: unless-stopped
    # Prometheus sets its Go memory limit to 90% of this by itself.
    mem_limit: 128m

  grafana:
    image: grafana/grafana:13.3.0@sha256:488984b716c0862639f91a698adbe2862677a5a07bad42da5f03f3030883b205
    profiles: [monitoring]
    # grafana.env (untracked) comes last, so it overrides the defaults.
    env_file: [monitoring/grafana/defaults.env, grafana.env]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_SECURITY_DISABLE_GRAVATAR: "true"
      # Nothing leaves the server: no usage reporting, update checks, news feed or plugin downloads.
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
      GF_ANALYTICS_CHECK_FOR_PLUGIN_UPDATES: "false"
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_PLUGINS_PREINSTALL_DISABLED: "true"
      GOMEMLIMIT: 220MiB
    ports:
      # Loopback only: reach it through an SSH tunnel, never publicly.
      - "127.0.0.1:3001:3000"
    volumes:
      - ./monitoring/grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./monitoring/grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/provisioning/alerting:/etc/grafana/provisioning/alerting:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped
    mem_limit: 256m

volumes:
  db-data:
  prometheus-data:
  grafana-data:
