# An email when API traffic stays far above normal: someone may be copying the site, or hammering it.
# Grafana reads this file on start, like the data source. The email goes to ALERT_EMAIL through the SMTP server in
# grafana.env (GF_SMTP_*, untracked), and defaults.env holds a placeholder so Grafana starts without them.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: Email
    receivers:
      - uid: email
        type: email
        settings:
          addresses: ${ALERT_EMAIL}
          singleEmail: true

policies:
  - orgId: 1
    receiver: Email
    group_by: [alertname]
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h

groups:
  - orgId: 1
    name: Traffic
    folder: Liminis
    interval: 1m
    rules:
      - uid: api-traffic-high
        title: API traffic is high
        condition: C
        for: 10m
        # No requests at all is no data, and that is normal at night.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: The backend has served more than one API request a second for 10 minutes. The usual peak is under 0.1.
          description: >-
            Each page load makes one to three API requests, so this is hundreds of pages in a few minutes.
            Look at the Service dashboard, and at "Rate limit" lines in the frontend's log.
        data:
          - refId: A
            datasourceUid: prometheus
            relativeTimeRange: { from: 600, to: 0 }
            model:
              # API requests a second over 5 minutes, except visitor events, which pages send as people read.
              expr: sum(rate(http_server_requests_seconds_count{uri=~"/api/.*", uri!="/api/events"}[5m]))
              instant: true
              refId: A
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
              refId: B
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator: { type: gt, params: [1] }
              refId: C
