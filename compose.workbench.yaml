# The workbench's Postgres on the curator's computer (compose.review.yaml extends it for the server). ./gradlew
# :workbench:bootRun or :auth:bootRun starts it through Spring Boot's Docker Compose support and connects to it; neither
# stops it on exit, as the other may still use it: docker compose -f compose.workbench.yaml stop. It is the site's db service (docker-compose.yml), same
# image and collation, with settings of its own (db/workbench.env), its port published on loopback, on a port Docker
# picks, and a named volume of its own: what the workbench fetches will live there.
name: liminis-workbench

services:
  db:
    extends:
      file: docker-compose.yml
      service: db
    env_file: !override
      - db/workbench.env
    ports:
      - "127.0.0.1::5432"
    volumes: !override
      - workbench-db-data:/var/lib/postgresql
    # The site's 256 MB suit a database of a few megabytes. This one holds gigabytes: mapping them took Postgres to
    # about 225 MB, and over 256 MB at times, where the kernel killed it mid-run.
    mem_limit: 2g

volumes:
  workbench-db-data:
