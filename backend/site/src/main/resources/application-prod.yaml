# Production profile (SPRING_PROFILES_ACTIVE=prod), used by the Docker image.
spring:
  # The db service in docker-compose.yml, as the two roles of db/roles.sql: the API only reads, and Flyway, which
  # creates and loads each release's schema, owns them. Their passwords come from db/roles.env, then db-roles.env.
  datasource:
    url: jdbc:postgresql://db:5432/liminis
    username: site_reader
    password: ${SITE_READER_PASSWORD}
  flyway:
    user: site_owner
    password: ${SITE_OWNER_PASSWORD}
    placeholders:
      reader: site_reader

management:
  server:
    # Actuator (health, Prometheus metrics) on a port of its own: the frontend forwards only a few /api paths to 8080,
    # and Compose publishes neither port, so only Prometheus, on the Compose network, can read it.
    port: 8081
