spring:
  application:
    name: backend
  threads:
    virtual:
      enabled: true
  datasource:
    # Postgres. On ./gradlew bootRun, Spring Boot's Docker Compose support starts it (backend/compose.yaml) and
    # connects to it; in the Docker image, application-prod.yaml points at the db service; tests run their own.
    hikari:
      maximum-pool-size: 5
  mvc:
    # Errors (404, 400) as RFC 9457 Problem Details: application/problem+json, described in api/openapi.yaml.
    problemdetails:
      enabled: true
  jpa:
    open-in-view: false
    hibernate:
      # Flyway creates the schema from core's db/migration; Hibernate only checks the entities match it.
      ddl-auto: validate
  http:
    clients:
      # For every RestClient, today only WikipediaClient: a slow article must not hold up enrichment.
      connect-timeout: 5s
      read-timeout: 5s

management:
  endpoints:
    web:
      exposure:
        # Prometheus scrapes /actuator/prometheus; nothing else but health is exposed. The prod profile moves
        # Actuator to a port of its own, which only the Compose network can reach.
        include: health, prometheus
  metrics:
    distribution:
      # Latency buckets for the p95 on the Service dashboard: a few fixed bounds instead of a full histogram
      # per route keeps the number of series small.
      slo:
        http.server.requests: 25ms, 50ms, 100ms, 250ms, 500ms, 1000ms, 2500ms, 5000ms

app:
  wikipedia:
    base-url: https://{language}.wikipedia.org/api/rest_v1
    # Wikimedia asks API clients for a contact in the User-Agent.
    user-agent: Liminis/0.1 (https://github.com/charlotte-hib/liminis-history)
    enrich: true
