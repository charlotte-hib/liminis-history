spring:
  application:
    name: auth
  threads:
    virtual:
      enabled: true
  # Postgres: on ./gradlew :auth:bootRun, Spring Boot's Docker Compose support starts the workbench's (compose.workbench.yaml)
  # and connects to it; tests run their own. The workbench may be using it too: never stop it on exit.
  docker:
    compose:
      lifecycle-management: start-only
  datasource:
    hikari:
      # Spring Security's JDBC stores name their tables without a schema.
      schema: auth
      # The workbench's Postgres takes 20 connections, the workbench's pool 10: a few sign-ins a day need no more.
      maximum-pool-size: 3
  # The accounts API's errors as Problem Details (RFC 9457), as the workbench's.
  mvc:
    problemdetails:
      enabled: true
  flyway:
    locations: classpath:db/auth
    schemas: auth
    default-schema: auth
    create-schemas: true
  security:
    oauth2:
      authorizationserver:
        # Passkeys are bound to a name, and localhost is the only one a browser lets a site on plain HTTP use: never
        # 127.0.0.1. On the server, its public address over HTTPS (compose.review.yaml).
        issuer: http://localhost:9000

# On the curator's computer, on loopback only: curate, wb and the workbench call it there. On the server, behind the
# server's Caddy, which says who the visitor is in X-Forwarded-For (compose.review.yaml).
server:
  address: 127.0.0.1
  port: 9000

app:
  auth:
    # Where auth writes the clients' secrets, readable by the curator only: curate's and wb's.
    secrets-dir: ${user.home}/.config/liminis
    # curate, the one client that signs the curator in: where auth sends the browser back.
    curate-url: http://localhost:3100
    # Prints a one-time sign-in link even when a passkey exists, to register a new one: start with
    # --app.auth.one-time-link=true.
    one-time-link: false
    allowed-hosts: [localhost, 127.0.0.1]
    signing-keys:
      # A new key signs from then on; the older one stays published, for the tokens it signed.
      rotate-after: 30d
      keep-for: 60d
      check-every: 1h
    accounts:
      # Time enough to forward the link and for its holder to find a moment.
      invitation-valid-for: 7d
      # As publishing asks: inviting and revoking take a passkey used in the last few minutes.
      max-age: 5m
