<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head th:replace="~{page :: head('Sign in')}"></head>
<body>
<header th:replace="~{page :: bar}"></header>
<main>
  <h1>Sign in</h1>
  <div class="card">
    <div class="alert error shown" role="alert" th:if="${failed}">That did not sign you in. Try again.</div>
    <p class="muted">With the passkey you registered on this computer: Touch ID, or your password.</p>
    <button id="passkey-signin" type="button">Sign in with a passkey</button>
  </div>
  <p class="muted">
    No passkey yet, or a new computer? Start auth with <code>--args=--app.auth.one-time-link=true</code> and open the
    link it prints: it lets you register one.
  </p>
</main>
<script src="/login/webauthn.js"></script>
<script th:inline="javascript">
  document.addEventListener("DOMContentLoaded", () =>
    setupLogin({ [[${csrf.headerName}]]: [[${csrf.token}]] }, "", document.getElementById("passkey-signin")));
</script>
</body>
</html>
