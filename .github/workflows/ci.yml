# Pull requests: test, build each image once, then run the API and end-to-end tests and the vulnerability scan against
# those images. Main: also publish the same images to GHCR, signed, and deploy them to the VPS once every check has
# passed.
# No long-lived secrets: GHCR uses the job token, Tailscale and SSH use GitHub's OIDC identity.
name: CI/CD

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: # Redeploy main by hand.

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version-file: .java-version
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Lint the API contract
        run: npx --yes @redocly/cli@2.54.2 lint ../api/openapi.yaml ../api/workbench.yaml --config ../api/redocly.yaml
      - run: ./gradlew test

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Check the API types are generated from the current spec
        run: npm run api:types && git diff --exit-code lib/api-schema.ts
      - run: npm run lint
      - run: npm run build

  # The curator's review app: runs on the curator's computer only, never in an image. Not a required check.
  curate:
    name: curate lint and build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: curate
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: curate/package-lock.json
      - run: npm ci
      - name: Check the API types are generated from the current spec
        run: npm run api:types && git diff --exit-code lib/api-schema.ts
      - run: npm run lint
      - run: npm run build

  images:
    name: Image (${{ matrix.service }})
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [backend, frontend]
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      PUBLISH: ${{ github.event_name != 'pull_request' }}
      IMAGE: ghcr.io/${{ github.repository }}-${{ matrix.service }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: env.PUBLISH == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}
      - id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=sha-${{ github.sha }}
            type=raw,value=latest,enable={{is_default_branch}}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.service }}
          # The backend image's API contract (backend/Dockerfile). The frontend's build does not use it.
          build-contexts: |
            api=api
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # The only build of this image in the run: the test jobs load this file and main pushes it.
          # Provenance comes from the attest step below, not from BuildKit.
          outputs: type=docker,dest=${{ runner.temp }}/image.tar
          provenance: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,scope=${{ matrix.service }},mode=max
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: image-${{ matrix.service }}
          path: ${{ runner.temp }}/image.tar
          retention-days: 1
      - name: Push to GHCR
        id: push
        if: env.PUBLISH == 'true'
        run: |
          docker load --input "$RUNNER_TEMP/image.tar"
          docker push --all-tags "$IMAGE"
          digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$IMAGE:sha-$GITHUB_SHA")
          echo "digest=${digest#*@}" >> "$GITHUB_OUTPUT"
      - name: Attest build provenance (SLSA)
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Generate SBOM (SPDX)
        if: env.PUBLISH == 'true'
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.IMAGE }}@${{ steps.push.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json
          upload-artifact: false
      - name: Attest SBOM
        if: env.PUBLISH == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.push.outputs.digest }}
          sbom-path: sbom.spdx.json
          push-to-registry: true
          create-storage-record: false

  # Smoke tests the backend image over real HTTP with the requests in http/api.http.
  # Only ever against this local container: production gets the read-only http/production.http (smoke.yml).
  api:
    name: API tests
    needs: images
    runs-on: ubuntu-latest
    env:
      COMPOSE: docker compose -f docker-compose.yml -f e2e/compose.yaml
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
      HTTP_CLIENT_IMAGE: jetbrains/intellij-http-client:2026.2.3@sha256:a69390757348c3a758ca36f7b213903929a5799c23702fb7aae2d222d90c59ef
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: image-backend
          path: ${{ runner.temp }}
      - name: Load the backend image
        run: docker load --input "$RUNNER_TEMP/image.tar"
      - name: Start the backend and its database
        # The image built above, with Postgres as in production. The overlay publishes the backend's port and turns
        # Wikipedia enrichment off: the data is exactly sample/, and the job does not depend on Wikipedia.
        run: |
          $COMPOSE pull --quiet db
          $COMPOSE up --no-build --pull never --detach backend
      - name: Wait for the API
        run: |
          for _ in $(seq 60); do
            curl --fail --silent --output /dev/null http://localhost:8080/api/moments && exit 0
            sleep 2
          done
          exit 1
      - name: Run the HTTP Client tests
        run: |
          docker run --rm --network host --volume "$PWD/http:/workdir" "$HTTP_CLIENT_IMAGE" \
            --env-file http-client.env.json --env ci --report --no-progress api.http
      - name: Backend logs
        if: failure()
        run: $COMPOSE logs backend db
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: api-test-report
          path: http/reports/
          if-no-files-found: ignore

  e2e:
    name: End-to-end
    needs: images
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: e2e
    env:
      COMPOSE: docker compose -f docker-compose.yml -f e2e/compose.yaml
      BACKEND_IMAGE: ghcr.io/${{ github.repository }}-backend:sha-${{ github.sha }}
      FRONTEND_IMAGE: ghcr.io/${{ github.repository }}-frontend:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: image-*
          path: ${{ runner.temp }}/images
      - name: Start the app from the images built above
        working-directory: .
        run: |
          for image in "$RUNNER_TEMP"/images/*/image.tar; do docker load --input "$image"; done
          $COMPOSE pull --quiet db
          $COMPOSE up --no-build --pull never --detach --wait
      - name: Wait for the backend behind the frontend
        run: timeout 180 sh -c 'until curl -fsS -o /dev/null "http://localhost:3000/api/search?q=a"; do sleep 2; done'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test
      - name: Upload the test report
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          retention-days: 7
      - name: Show the app logs
        if: failure()
        working-directory: .
        run: $COMPOSE logs

  scan:
    name: Vulnerability scan
    needs: images
    uses: ./.github/workflows/scan.yml
    with:
      built: true
    permissions:
      contents: read
      deployments: read
      security-events: write

  deploy:
    name: Deploy to production
    needs: [images, api, e2e, scan]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production
      cancel-in-progress: false
    permissions:
      contents: read
      packages: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: release.lock
          sparse-checkout-cone-mode: false
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.4
      - name: Pull the release
        # The private bundle release.lock pins, by digest. Its package grants this repository's Actions read access,
        # so the job token is enough.
        run: |
          echo "${{ github.token }}" | oras login ghcr.io --username "${{ github.actor }}" --password-stdin
          oras pull --output "$RUNNER_TEMP/release" "$(sed -n 's/^RELEASE_BUNDLE=//p' release.lock)"
      - name: Resolve image digests and verify their provenance
        id: images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for service in backend frontend; do
            image="$IMAGE_PREFIX-$service"
            digest=$(docker buildx imagetools inspect "$image:sha-$GITHUB_SHA" --format '{{json .Manifest}}' | jq -r .digest)
            gh attestation verify "oci://$image@$digest" \
              --repo "$GITHUB_REPOSITORY" \
              --signer-workflow "$GITHUB_REPOSITORY/.github/workflows/ci.yml" \
              --source-ref "$GITHUB_REF"
            echo "$service=$image@$digest" >> "$GITHUB_OUTPUT"
          done
      - name: Join the tailnet
        uses: tailscale/github-action@d1b6cd204f8dceda5b3eaad7f1f767be390056cd # v4.2.0
        with:
          oauth-client-id: ${{ vars.TS_OAUTH_CLIENT_ID }}
          audience: ${{ vars.TS_AUDIENCE }}
          tags: tag:ci
          ping: ${{ vars.VPS_HOST }}
      - name: Roll out on the VPS
        # Tailscale SSH: the tailnet authenticates both ends, so there is no SSH key and no host key to pin.
        # The release bundle goes on stdin; deploy.sh unpacks it unless the server has it already.
        run: |
          ssh -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null "deploy@${{ vars.VPS_HOST }}" \
            "cd /opt/liminis && git fetch --quiet origin && git checkout --quiet --detach $GITHUB_SHA && \
             deploy/deploy.sh $GITHUB_SHA ${{ steps.images.outputs.backend }} ${{ steps.images.outputs.frontend }}" \
            < "$RUNNER_TEMP/release/release.tar.gz"

  smoke:
    name: Smoke test
    needs: deploy
    uses: ./.github/workflows/smoke.yml
